name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes older runs unnecessary.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Production build
        run: npm run build

  schema:
    name: Validate database schema and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legalsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema to a clean database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legalsync_test
          JWT_SECRET: ci-only-secret
          APP_URL: http://localhost:3000
        run: npm run db:migrate

      - name: Re-apply schema to prove migrations are idempotent
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legalsync_test
          JWT_SECRET: ci-only-secret
          APP_URL: http://localhost:3000
        run: npm run db:migrate

  e2e:
    name: End-to-end (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        env:
          CI: true
          PLAYWRIGHT_HTML_OPEN: never
          # The suite asserts anonymous redirects, so no session is needed.
          JWT_SECRET: ci-only-secret
        run: npm run test:e2e -- --project=chromium --reporter=list

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7